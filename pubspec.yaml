# ============================================================================
# pubspec.yaml - Silvia Pico UI
# ============================================================================
name: silvia_pico_ui
description: EspressoPico UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.36.8
  fl_chart: ^1.2.0                    # <-- Päivitetty
  flutter_riverpod: ^2.6.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  wakelock_plus: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  json_serializable: ^6.9.5
  freezed: ^2.5.8
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/appstore.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/appstore.png"
  adaptive_icon_background: "#F5F5F5"
  adaptive_icon_foreground: "assets/appstore.png"
