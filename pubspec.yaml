# ============================================================================
# pubspec.yaml - Silvia Pico UI (MAXIMAL LATEST VERSIONS)
# ============================================================================
name: silvia_pico_ui
description: EspressoPico UI
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: any
  fl_chart: any
  flutter_riverpod: any
  json_annotation: any
  freezed_annotation: any
  wakelock_plus: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  json_serializable: any
  freezed: any
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/appstore.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/appstore.png"
  adaptive_icon_background: "#F5F5F5"
  adaptive_icon_foreground: "assets/appstore.png"
